[project]
name = "whetstone"
version = "0.1.0"
description = "WHETSTONE — end-to-end training procedure for installing a compact reasoning style via verifiable-reward RL."
requires-python = ">=3.12"
dependencies = [
    # ---- Verified stack, P0 / activity 001 (2026-08-01) -------------------
    # Installed and smoke-tested identically on turing (x86_64, RTX 5090,
    # sm_120) and spark (aarch64, GB10, sm_121). vLLM pins its own torch —
    # install vLLM FIRST and let it bring torch, then layer the rest.
    # vllm 0.26.0 brings torch 2.11.0+cu130, which ships sm_120 kernels
    # (Blackwell) and a real CUDA aarch64 wheel, so no NGC container is needed.
    "vllm==0.26.0",
    # Inference (Stage A/C rollouts, Stage 1/4/5 in v1 terms).
    "transformers>=5.14.1",
    "accelerate>=1.14.0",
    "peft>=0.20.0",
    "trl>=1.9.2",
    "datasets>=5.0.1",
    "safetensors>=0.8",
    # vLLM shells out to `ninja` by NAME for torch.compile / inductor codegen.
    # It must be importable AND on PATH — activate the venv, do not call
    # .venv/bin/python directly (see activity 001, gotcha 1).
    "ninja>=1.13",
    # Dashboards are first-class stage deliverables (design §7), not an
    # afterthought — the plotting dep is core, not an extra.
    "matplotlib>=3.9",
    # 8-bit Adam moments for the Round-0 / Stage-B trainers (activity 007).
    # Full-FT of 1.7B on one 32 GB card needs fp32 master weights (a 1e-5 Adam
    # update is 12x below bf16's quantum, so bf16 weights silently no-op), and
    # fp32 weights + fp32 grads + fp32 Adam moments + the SED shadow is 28.9 GiB
    # resident — it OOMs on activations. Quantizing only the moments keeps the
    # fp32 master weights and brings the run to 19.2 GiB.
    "bitsandbytes>=0.50",
    # Test runner (SED kernel + segment parser gates).
    "pytest>=8",
    # Audit / cloud API (compression spot-check).
    "anthropic>=0.40",
    # CLI helpers.
    "fire>=0.6",
    "loguru>=0.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
# v1 / Gemma-4 only. liger-kernel 0.8.0 returns a 4-tuple from
# unpack_cross_entropy_result, which whetstone/patches/gemma4_liger_patch.py
# assumes. NOT installed for the Qwen3 v2 path — the gemma4 patches must not be
# imported anywhere in it (CLAUDE.md invariant).
gemma-v1 = [
    "liger-kernel==0.8.0",
]
# Qwen3.5 / Qwen3-Next paths only — not needed for Qwen3-1.7B/4B/8B.
fla = [
    "flash-linear-attention==0.5.0",
    "causal-conv1d==1.6.2.post1",
]

[tool.uv]
default-groups = []

[tool.uv.sources]
# vllm 0.26.0 already resolves torch 2.11.0+cu130 from its own metadata on both
# x86_64 and aarch64; this index is kept as the explicit fallback for a fresh
# host where torch is installed before vLLM.
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.pip]
no-build-isolation-package = ["causal-conv1d"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whetstone"]
